name: CI-CD
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build image inside minikube
        run: |
          & minikube -p minikube docker-env --shell powershell | Invoke-Expression
          docker build -t demo-app:${{ github.sha }} .

      - name: Update image tag in deployment.yaml
        run: |
          (Get-Content k8s/deployment.yaml) -replace 'image: demo-app:.*', 'image: demo-app:${{ github.sha }}' | Set-Content k8s/deployment.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/demo-app --timeout=120s